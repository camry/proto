syntax = "proto3";
package cpb;

option go_package = "gitea.meigushi.go/meigushi/pb/cpb";

message Config {
    string env = 1; // ENV
    string timezone = 2; // Timezone
    string locale = 3; // Locale
    string mysql_dns = 4; // MySQL DNS
    string mongo_uri = 5; // Mongo URI
    string nats_url = 6; // NATS URL
    RedisConfig cache = 7; // Cache Redis Config
    RedisConfig tmp_cache = 8; // Tmp Cache Redis Config
}

message RedisConfig {
    string addr = 1;
    string username = 2;
    string password = 3;
    int32 db = 4;
}
