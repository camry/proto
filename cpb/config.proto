syntax = "proto3";
package cpb;

option go_package = "gitea.meigushi.go/meigushi/pb/cpb";

message Config {
    string env = 1; // ENV
    string name = 2; // Name
    string timezone = 3; // Timezone
    string locale = 4; // Locale
    string mysql_dns = 5; // MySQL DNS
    string mongo_uri = 6; // Mongo URI
    RedisConfig cache = 7; // Cache Redis Config
    RedisConfig tmp_cache = 8; // Tmp Cache Redis Config
}

message RedisConfig {
    string addr = 1;
    string username = 2;
    string password = 3;
    int32 db = 4;
}
