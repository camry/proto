syntax = "proto3";
package cpb;

option go_package = "gitea.meigushi.go/meigushi/pb/cpb";

message Config {
    string env = 1; // ENV
    string timezone = 2; // Timezone
    string locale = 3; // Locale
    string data_path = 4; // Data Path
    string mysql_dns = 5; // MySQL DNS
    string mongo_uri = 6; // Mongo URI
    string nats_url = 7; // NATS URL
    RedisConfig cache = 8; // Cache Redis Config
    RedisConfig tmp_cache = 9; // Tmp Cache Redis Config
}

message RedisConfig {
    string addr = 1;
    string username = 2;
    string password = 3;
    int32 db = 4;
}
