syntax = "proto3";
package cpb;

option go_package = "github.com/camry/pb/cpb";

message CTables {
    string table_name = 1; // 表名
    uint32 table_crc = 2; // 表CRC
    bytes table_data = 3; // 表数据
    string created_at = 4; // 创建时间
}

message CTableIndex {
    string table_name = 1; // 表名
    uint32 table_crc = 2; // 表CRC
}

message CTableIndexList {
    repeated CTableIndex table_index_list = 1; // 表索引列表
}
